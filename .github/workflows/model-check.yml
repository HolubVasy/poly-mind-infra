# Monthly review of the models behind the presets (rules: CLAUDE.md, "Monthly
# model review"). The owner's part is one Telegram message a month: open the
# pull request, read the before -> after table, merge.
#
# 1. scripts/check_models.py compares models/slots.yaml with OpenRouter and
#    refreshes the prices in slots.yaml; build_presets.py regenerates titles.
# 2. Claude picks, per slot, the newest model of the same line and runs
#    scripts/judge.py on every candidate (standard prompt, judge model, verdict
#    to docs/model-log.md). Winners and successors of vanished models go into
#    slots.yaml; then ONE pull request with a before -> after table.
# 3. scripts/gate_check.py verifies the branch: every replaced model either
#    vanished from OpenRouter or won its verdict today. A branch that fails
#    the gate is closed, not merged.
# 4. Only vanished-model replacements and price markers merge and deploy on
#    their own (label auto-merge). Everything else waits for the owner.
# 5. A plain curl sends the Telegram message. Silent when there is no PR.
#
# dry_run (manual): steps 1 and the diff only; no Claude, no PR, no message.
# Pull requests opened with GITHUB_TOKEN do not trigger the Validate workflow,
# so validate.py and gate_check.py run here, before the PR is opened.
name: Model check

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report and show the price diff; no Claude, no PR, no Telegram"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: write

concurrency:
  group: model-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BRANCH: model-check-${{ github.run_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPORT_MD: /tmp/model-report.md
      REPORT_JSON: /tmp/model-report.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml

      - name: Facts from OpenRouter, prices into slots.yaml
        run: |
          python scripts/check_models.py --json "$REPORT_JSON" --update-prices > "$REPORT_MD"
          jq -r '.shelves[]? | "• " + .' "$REPORT_JSON" > /tmp/shelves.txt
          python scripts/build_presets.py
          python scripts/validate.py
          cat "$REPORT_MD" >> "$GITHUB_STEP_SUMMARY"
          echo '## Price diff' >> "$GITHUB_STEP_SUMMARY"
          echo '```diff' >> "$GITHUB_STEP_SUMMARY"
          git diff -- models/slots.yaml presets/presets.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run stops here
        if: ${{ inputs.dry_run }}
        run: echo "dry run - no Claude, no pull request, no Telegram" >> "$GITHUB_STEP_SUMMARY"

      - name: Label for the auto-merge path
        if: ${{ !inputs.dry_run }}
        run: gh label create auto-merge --color B60205 --description "Only vanished-model replacements and price markers; merged by the workflow" --force

      - name: Claude reviews the slots
        if: ${{ !inputs.dry_run }}
        uses: anthropics/claude-code-action@v1
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: |
            You are running the monthly model review of this repository.
            Read CLAUDE.md first, especially "Monthly model review" and
            "Presets" - their rules are binding. The facts gathered a minute
            ago are in ${{ env.REPORT_MD }} (Markdown) and ${{ env.REPORT_JSON }}
            (JSON). The working tree may already contain refreshed prices in
            models/slots.yaml and presets/presets.json - keep them.

            Do this, in order:
            1. For every slot in models/slots.yaml decide whether a newer model
               of the SAME vendor on the SAME RUNG of its ladder exists in the
               report's candidates (Sonnet 5 -> Sonnet 5.1, GPT-5.2 -> GPT-5.6).
               The report already filters by rung and drops :batch, :free and
               preview variants; do not go outside its candidate lists. Do not
               fill empty shelves and do not move a model between categories:
               that is the owner's positioning decision (see "Полки").
               Stay within max_models.
            2. For every such candidate run the quality gate:
               python scripts/judge.py --slot "<Vendor>/<category>" --current <old id> --candidate <new id> --judge <id of the Claude flagship slot>
               (for an empty category use the vendor's frontier model as
               --current, or the Claude frontier if the vendor has none).
               Read the JSON verdict it prints. better / equal -> the candidate
               goes in. worse / failed -> it does not; the log already has
               the reason. Do not edit docs/model-log.md by hand.
            3. A model listed under "Missing models" is replaced by its direct
               successor (same vendor, category and line) without a verdict.
            4. Apply the accepted changes to models/slots.yaml: same presetId,
               new id, new label, out_per_m from the report. Add every new id
               to the "Все" list in librechat/librechat.yaml; remove a replaced
               id from that list unless another slot or another endpoint still
               uses it. Keep the first model of the list unchanged.
            5. Run, and fix until all pass:
               python scripts/build_presets.py
               python scripts/validate.py
               python scripts/gate_check.py --base origin/main --report ${{ env.REPORT_JSON }}
            6. Whatever you change or not, read the section "Полки" of the
               report: those notes are about categories - shelves that crossed
               by price, a new pricier line, an empty category of a core
               vendor. NEVER re-categorise a model yourself and never fill a
               shelf from a note alone: copy the notes into the pull request
               under a heading "Полки" so the owner decides.
            7. If `git status --porcelain` is empty: make no commit, no branch,
               no pull request, and end with the single line NO CHANGES.
            8. Otherwise: git checkout -b "${{ env.BRANCH }}", commit everything
               (including docs/model-log.md) with a short message, push, and
               open ONE pull request against main with `gh pr create`. The
               body must have a before -> after table (slot, old model, new
               model, old price, new price, why - with the judge's reason or
               "vanished from OpenRouter" or "price"), the list of missing
               models, and the list of candidates that lost with one line each.
               If gate_check.py printed "auto-merge: yes", add the label
               auto-merge with `gh pr edit --add-label auto-merge`.
          claude_args: '--allowed-tools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(python scripts/*),Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh pr view:*),Bash(gh label list:*)"'

      - name: Gate the pull request, merge the safe ones
        id: pr
        if: ${{ !inputs.dry_run }}
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number,url,title --jq '.[0] // empty')
          if [ -z "$pr" ]; then
            echo "outcome=none" >> "$GITHUB_OUTPUT"
            echo "No pull request this month." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          number=$(echo "$pr" | jq -r .number)
          url=$(echo "$pr" | jq -r .url)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          git fetch -q origin "$BRANCH"
          git checkout -q "origin/$BRANCH"
          if ! python scripts/validate.py || ! python scripts/gate_check.py --base origin/main --report "$REPORT_JSON" --json /tmp/gate.json; then
            gh pr close "$number" --comment "Closed by the Model check workflow: validate.py or gate_check.py failed on this branch (see the run). Nothing was merged."
            echo "outcome=closed" >> "$GITHUB_OUTPUT"
            echo "PR #$number failed the gate and was closed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if jq -e '.auto_merge' /tmp/gate.json >/dev/null && gh pr view "$number" --json labels --jq '.labels[].name' | grep -qx auto-merge; then
            gh pr merge "$number" --squash --delete-branch
            # A merge made with GITHUB_TOKEN does not trigger other workflows,
            # so start the deploy explicitly.
            gh workflow run deploy.yml --ref main
            echo "outcome=merged" >> "$GITHUB_OUTPUT"
            echo "PR #$number only replaced vanished models / price markers: merged and deployed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "outcome=open" >> "$GITHUB_OUTPUT"
            echo "PR #$number waits for the owner: $url" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Telegram
        if: ${{ always() && !inputs.dry_run }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OUTCOME: ${{ steps.pr.outputs.outcome }}
          PR_URL: ${{ steps.pr.outputs.url }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not set - nothing sent." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          # gate_check.py leaves one ready Russian line per change in .digest
          # (what was replaced, why, and what it costs now).
          digest=""
          if [ -s /tmp/gate.json ]; then
            digest=$(jq -r '.digest[]? | "• " + .' /tmp/gate.json)
          fi
          # Category notes: shelves crossed, a new pricier line, an empty shelf.
          # They are worth a message even in a month when nothing changed.
          shelves=""
          [ -s /tmp/shelves.txt ] && shelves=$(cat /tmp/shelves.txt)
          case "$OUTCOME:$JOB_STATUS" in
            open:*)    text=$(printf '🗳 Модели чата: PR #%s ждёт тебя.\n%s\n%s\n\nПочему так решено и ответы моделей - в PR: %s' "$PR_NUMBER" "$digest" "$shelves" "$PR_URL") ;;
            merged:*)  text=$(printf '✅ Модели чата: PR #%s смёржен и выкачен сам.\n%s\n\n%s' "$PR_NUMBER" "$digest" "$PR_URL") ;;
            none:success)
              if [ -z "$shelves" ]; then
                echo "No PR, no shelf notes, nothing to say." >> "$GITHUB_STEP_SUMMARY"; exit 0
              fi
              text=$(printf '🔎 Модели чата: менять нечего, но глянь категории:\n%s\n\n%s' "$shelves" "$RUN_URL") ;;
            *)         text=$(printf '⚠️ Модели чата: проверка упала (%s). %s' "${OUTCOME:-нет PR}" "$RUN_URL") ;;
          esac
          curl -sS -o /dev/null -w "telegram: %{http_code}\n" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$text" \
            --data-urlencode "disable_web_page_preview=true" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"

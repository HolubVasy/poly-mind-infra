# Monthly review of the models behind the presets (rules: CLAUDE.md, "Monthly
# model review"). The owner's part is one Telegram message a month: open the
# pull request, read the table, merge.
#
# 1. scripts/check_models.py compares models/slots.yaml with OpenRouter and
#    refreshes the prices in slots.yaml; build_presets.py regenerates titles.
# 2. Claude runs scripts/judge.py on the newest model of each slot's line
#    (standard prompt, judge model, verdict to docs/model-log.md), puts the
#    winners and the successors of vanished models into slots.yaml, and opens
#    ONE pull request with a before -> after table.
# 3. scripts/gate_check.py verifies the branch: every replaced model either
#    vanished from OpenRouter or won its verdict today. A branch that fails
#    is closed, never merged.
# 4. scripts/strength_check.py runs the old and the new model of every
#    replaced slot on one ~100k-token manuscript: a signal for the owner,
#    never a block, capped at $5 by its own estimate.
# 5. A plain curl sends the Telegram message. Silent when there is no PR.
#
# dry_run (manual): step 1 and the diff only; no Claude, no PR, no message.
# Pull requests opened with GITHUB_TOKEN do not trigger the Validate workflow,
# so validate.py and gate_check.py run here, on the branch.
name: Model check

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report and show the price diff; no Claude, no PR, no Telegram"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: model-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BRANCH: model-check-${{ github.run_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPORT_MD: /tmp/model-report.md
      REPORT_JSON: /tmp/model-report.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml

      - name: Facts from OpenRouter, prices into slots.yaml
        run: |
          python scripts/check_models.py --json "$REPORT_JSON" --update-prices > "$REPORT_MD"
          python scripts/build_presets.py
          python scripts/validate.py
          cat "$REPORT_MD" >> "$GITHUB_STEP_SUMMARY"
          echo '## Price diff' >> "$GITHUB_STEP_SUMMARY"
          echo '```diff' >> "$GITHUB_STEP_SUMMARY"
          git diff -- models/slots.yaml presets/presets.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run stops here
        if: ${{ inputs.dry_run }}
        run: echo "dry run - no Claude, no pull request, no Telegram" >> "$GITHUB_STEP_SUMMARY"

      - name: Claude reviews the slots
        if: ${{ !inputs.dry_run }}
        uses: anthropics/claude-code-action@v1
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: |
            You are running the monthly model review of this repository.
            Read CLAUDE.md first, especially "Monthly model review" and
            "Presets" - their rules are binding. The facts gathered a minute
            ago are in ${{ env.REPORT_MD }} (Markdown) and ${{ env.REPORT_JSON }}
            (JSON). The working tree may already contain refreshed prices in
            models/slots.yaml and presets/presets.json - keep them.

            Do this, in order:
            1. For every slot, the report lists the newer models of the same
               line (candidates). The newest of them is THE candidate for that
               slot. No candidates -> nothing to do for that slot. Never pick
               a model outside the candidate list, never move a model between
               categories, never fill an empty shelf.
            2. For every candidate run the quality gate:
               python scripts/judge.py --slot "<Vendor>/<category>" --current <old id> --candidate <new id> --judge <id of the Claude flagship slot>
               Read the JSON verdict it prints. better / equal -> the candidate
               goes in. worse / failed -> it does not; the log already has the
               reason. Do not edit docs/model-log.md by hand.
            3. A model listed under "Missing models" is replaced by the newest
               model of its line without a verdict.
            4. Apply the accepted changes to models/slots.yaml: same presetId,
               new id, new label, out_per_m from the report; keep `line`. Add
               every new id to the "Все" list in librechat/librechat.yaml and
               remove the replaced id from that list unless another slot or
               another endpoint still uses it. Keep the first model of the
               list unchanged. If the replaced id is the endpoint's
               `titleModel`, put the new id there too. Do not touch `helpers:` - each names a slot
               by its `line` and follows the new model by itself.
               docs/памятка.md names models without versions ("Opus",
               "Fable"); its menu table is regenerated by build_presets.py.
               If an old label ("Opus 5.5") is still in it anywhere else,
               replace it with the new one - gate_check.py fails while it
               is there. Never edit docs/памятка.docx: the Memo workflow
               rebuilds it from the .md after the merge.
            5. Run, and fix until all pass:
               python scripts/build_presets.py
               python scripts/validate.py
               python scripts/gate_check.py --base origin/main --report ${{ env.REPORT_JSON }}
            6. If `git status --porcelain` is empty: make no commit, no branch,
               no pull request, and end with the single line NO CHANGES.
            7. Otherwise: git checkout -b "${{ env.BRANCH }}", commit everything
               (including docs/model-log.md) with a short message, push, and
               open ONE pull request against main with `gh pr create`. The
               body must have a before -> after table (slot, old model, new
               model, old price, new price, why - the judge's reason, or
               "vanished from OpenRouter", or "price"), the procedure buttons
               that moved with a slot (gate_check.py prints them), the list
               of missing models, and the candidates that lost, one line each.
          claude_args: '--allowed-tools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(python scripts/*),Bash(gh pr create:*),Bash(gh pr view:*)"'

      - name: Gate the pull request
        id: pr
        if: ${{ !inputs.dry_run }}
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number,url --jq '.[0] // empty')
          if [ -z "$pr" ]; then
            echo "outcome=none" >> "$GITHUB_OUTPUT"
            echo "No pull request this month." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          number=$(echo "$pr" | jq -r .number)
          url=$(echo "$pr" | jq -r .url)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          git fetch -q origin "$BRANCH"
          git checkout -q "origin/$BRANCH"
          if ! python scripts/validate.py || ! python scripts/gate_check.py --base origin/main --report "$REPORT_JSON" --json /tmp/gate.json; then
            gh pr close "$number" --comment "Closed by the Model check workflow: validate.py or gate_check.py failed on this branch (see the run). Nothing was merged."
            echo "outcome=closed" >> "$GITHUB_OUTPUT"
            echo "PR #$number failed the gate and was closed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "outcome=open" >> "$GITHUB_OUTPUT"
          echo "PR #$number waits for the owner: $url" >> "$GITHUB_STEP_SUMMARY"

      # A signal, not a gate: old and new model on the same ~100k-token
      # manuscript (where Fable used to stall). Only when a model is replaced;
      # skipped above $5 by its own estimate. Result goes to the PR and Telegram.
      - name: Long text signal
        if: ${{ !inputs.dry_run && steps.pr.outputs.outcome == 'open' }}
        continue-on-error: true
        timeout-minutes: 20
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          python scripts/strength_check.py --base origin/main --cap 5 --json /tmp/strength.json | tee -a "$GITHUB_STEP_SUMMARY"
          comment=$(jq -r '.comment // ""' /tmp/strength.json)
          [ -n "$comment" ] && gh pr comment "$PR_NUMBER" --body "$comment" || true

      - name: Telegram
        if: ${{ always() && !inputs.dry_run }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OUTCOME: ${{ steps.pr.outputs.outcome }}
          PR_URL: ${{ steps.pr.outputs.url }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not set - nothing sent." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          # gate_check.py leaves one ready Russian line per change in .digest
          # (what was replaced, why, and what it costs now).
          digest=""
          [ -s /tmp/gate.json ] && digest=$(jq -r '.digest[]? | "• " + .' /tmp/gate.json)
          [ -s /tmp/strength.json ] && digest=$(printf '%s\n%s' "$digest" "$(jq -r '.lines[]? | "• " + .' /tmp/strength.json)")
          case "$OUTCOME:$JOB_STATUS" in
            open:*)       text=$(printf '🗳 Модели чата: PR #%s ждёт тебя.\n%s\n\nПочему так решено и ответы моделей - в PR: %s' "$PR_NUMBER" "$digest" "$PR_URL") ;;
            none:success) echo "No PR, nothing to say." >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
            *)            text=$(printf '⚠️ Модели чата: проверка упала (%s). %s' "${OUTCOME:-нет PR}" "$RUN_URL") ;;
          esac
          curl -sS -o /dev/null -w "telegram: %{http_code}\n" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$text" \
            --data-urlencode "disable_web_page_preview=true" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"

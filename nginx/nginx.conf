limit_req_zone $binary_remote_addr zone=forpost_rl:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=forpost_conn:10m;

server {
  listen 443 ssl http2;
  server_name chat.poly-mind.net;

  ssl_certificate      /etc/letsencrypt/live/chat.poly-mind.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/chat.poly-mind.net/privkey.pem;

  client_max_body_size 50M;

  # Resolve the LibreChat container per request (Docker DNS), not once at nginx start:
  # a recreated container gets a new address, and a stale one means 502 for everyone.
  resolver 127.0.0.11 valid=30s;
  set $librechat_upstream http://api:3080;

  # --- 1. ЗАЩИЩЕННАЯ ЗОНА (Вход в чат) ---
  location / {
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Лекарство от лишних окон при проверке связи браузером
    if ($request_method = OPTIONS) {
        return 204;
    }

    proxy_pass $librechat_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # --- 2. ОТКРЫТАЯ ЗОНА (API + HEALTH + СТАТИКА) ---
  # Самое важное: добавил 'health', чтобы сервер не просил пароль на проверке здоровья
  location ~* ^/(api|health|socket\.io|_next|assets|oauth|images|fonts|manifest\.json|favicon\.ico|site\.webmanifest) {
    auth_basic off;

    proxy_pass $librechat_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}


# --- ForPost (MCP tunnel) ---
server {
    listen 80;
    server_name forpost.poly-mind.net;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name forpost.poly-mind.net;
    ssl_certificate /etc/letsencrypt/live/forpost.poly-mind.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forpost.poly-mind.net/privkey.pem;
    client_max_body_size 50M;
    resolver 127.0.0.11 valid=30s;
    set $forpost_upstream http://forpost:8000;
    location / {
        limit_req zone=forpost_rl burst=40 nodelay;
        limit_conn forpost_conn 30;
        limit_req_status 429;
        limit_conn_status 429;
        proxy_pass $forpost_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

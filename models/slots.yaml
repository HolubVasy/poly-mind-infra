# The chat's models, arranged by vendor and category. This file is the source
# of truth for presets/presets.json, which scripts/build_presets.py generates
# from it - do not edit presets.json by hand, validate.py rejects that.
#
# Categories (the same three for every vendor):
#   flagship  - the strongest model the vendor sells (Fable / GPT Pro / Gemini Pro)
#   frontier  - the strong everyday model one step below (Opus, Sonnet / GPT / Grok)
#   workhorse - cheap and fast (Haiku / GPT mini / Gemini Flash)
# A category may hold any number of models, including none. Every model here
# is one preset in the chat; its title is built from vendor, category, label
# and price, so a new version of a line replaces the old entry in place (keep
# the presetId) and the mother sees the same preset with a new version.
#
# Per model:
#   id        - OpenRouter model id; must also be in the "Все" list of librechat.yaml
#   presetId  - stable UUID of the preset in MongoDB; never changes for a slot
#   label     - short human name shown in brackets in the preset title
#   out_per_m - output price in USD per 1M tokens, as OpenRouter reports it;
#               refreshed by scripts/check_models.py --update-prices, never typed
#
# Vendors: the four frontier labs, then the Chinese ones. Kimi and GLM stay;
# other vendors are added only after they proved themselves on the standard
# test (see CLAUDE.md, "Monthly model review"). Adding a vendor is one block.

endpoint: "Все"

# Hard cap on presets in the chat, so the menu stays readable. A new model
# beyond the cap must replace one, not be added next to it.
max_models: 15

categories:
  flagship:  { title: "флагман",   icon: "🧠" }
  frontier:  { title: "передовая", icon: "🔥" }
  workhorse: { title: "рабочая",   icon: "⚡" }

# Price marker x<N> = out_per_m / price_unit, rounded. Colour by that N.
price_unit: 2.5
colours:
  - { max: 1, emoji: "⚪️" }
  - { max: 7, emoji: "🟢" }
  - { emoji: "🔴" }

vendors:

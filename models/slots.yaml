# The chat's models, arranged by vendor and category. This file is the source
# of truth for presets/presets.json, which scripts/build_presets.py generates
# from it - do not edit presets.json by hand, validate.py rejects that.
#
# Three categories, top to bottom, the same for every vendor:
#   flagship  - THE model the vendor positions as its best. One per vendor.
#   workhorse - the everyday model (a vendor's only strong line lives here)
#   cheap     - cost-effective, for simple tasks
# There is no "frontier" shelf on purpose (owner, 2026-09-23): "a step below
# the flagship" is a tier for vendors, not for the mother - Opus at twice the
# price of Sonnet was neither here nor there.
# The category is the owner's call, by how the vendor positions the model -
# not by price, and not computed. Empty shelves are legitimate: a vendor that
# sells no model of a rung has none here, nothing is added to fill a grid.
#
# Per model:
#   id        - OpenRouter model id; must also be in the "Все" list of librechat.yaml
#   presetId  - stable UUID of the preset in MongoDB; never changes for a slot
#   label     - short human name shown in the preset title
#   line      - the word in the id that names the model's line (opus, sonnet,
#               sol-pro, flash). The monthly check looks for a NEWER model of
#               the same vendor whose id contains this word - that is the
#               only kind of candidate it proposes (Opus 5 -> Opus 5.5).
#   out_per_m - output price in USD per 1M tokens, as OpenRouter reports it;
#               refreshed by scripts/check_models.py --update-prices, never typed
#   purpose   - one line for the menu table in docs/памятка.md: what the
#               button is for. Stays when a newer version replaces the model.
#   rank      - place inside the category in the menu, 1 = strongest; the
#               owner's call on the evidence in docs/ (bench and long-context
#               runs of 2026-09-22/23). Models without a rank go after the
#               ranked ones, in vendor order.
#   max_context - optional hard cap on the preset's context, in LibreChat's
#               own token count (its local Claude/o200k tokenizer); default
#               900000. LibreChat refuses a message that alone does not fit
#               and drops the oldest messages of a longer chat. From the
#               second message on it scales its count by the provider's real
#               usage (about x2.25 for Fable on Russian), so the cap then
#               means real tokens. Set it only where a model is proven to
#               fail on long input; helpers on that slot inherit it. Stays
#               when a newer version replaces the model - drop it by PR once
#               the new version passes the long-text test.
#   reasoning_effort - optional: low, medium or high. Sent with every request
#               of the preset (OpenRouter `reasoning.effort`; for Claude
#               LibreChat maps it to the effort parameter). Without it the
#               model runs on OpenRouter's default for that model (high for
#               Fable, Opus and Grok, medium for the OpenAI models and Gemini,
#               as of 2026-10-16). Owner's call, no xhigh or max (2026-10-16).
#               Helpers on the slot inherit it, as with max_context. Stays when
#               a newer version replaces the model.
#
# Menu order inside a category: by rank, then by the order of the vendors here.
# Preset = slot: a new version replaces the entry in place, keeps its presetId,
# and the mother sees the same preset with a new version.

endpoint: "Все"

# Hard cap on presets in the chat, so the menu stays readable.
max_models: 20

# One line every preset starts with - the model buttons too. It blocks the
# two failure modes the tests showed (inventing, guessing instead of saying
# "I do not know"). Owner's rule, 2026-09-23.
common_prefix: |
  Ничего не додумывай и не предполагай. Не знаешь - так и скажи. Не проверено -
  пометь как непроверенное. Ссылок, чисел и названий не выдумывай.

# Helper presets: not a model slot but a button with a procedure - a model
# and instructions baked in, so the rule lives in the button, not in memory.
# `slot` names the model by the `line` of a model slot below, never by id:
# the button always runs on whatever model that slot holds today, so the
# monthly refresh (Opus 5.5 -> the next Opus) moves the buttons with it and
# no button is left on a replaced or vanished model.
# `instructions` is inline text; `instructions_file` is a file in the repo
# (the памятка) appended after `intro`. build_presets.py copies the text into
# the preset's promptPrefix. Helpers go to the top of the menu, in this order.
helpers:
  - presetId: 5b7c1c2e-9a0f-4c1d-8f3a-2e6d7a1b4c90
    title: "❓ Какую кнопку?"
    purpose: "подсказать, какую кнопку жать"
    slot: luna-pro
    instructions_file: docs/памятка.md
    intro: |
      Ты помощник по выбору кнопки (модели) в этом чате. Пользователь описывает
      задачу - ответь коротко, в 2-4 строках: какую кнопку взять (значок и
      название), почему одной фразой, и что приложить или написать первой
      строкой, если это нужно. Если документ длинный - напомни про два шага.
      Не делай саму задачу, только подскажи кнопку. Памятка ниже -
      единственный источник.

  - presetId: 8e2f4a6c-1b3d-4e5f-9a7b-0c1d2e3f4a5b
    title: "🧭 Новый вопрос"
    purpose: "любой вопрос: сначала уточнит, потом ответит"
    slot: opus
    instructions: |
      Порядок работы с любым вопросом.
      1. Не отвечай сразу. Задай уточняющие вопросы - по одному, дожидаясь
         ответа на каждый, не больше трёх. Спрашивай только то, что реально
         меняет ответ: цель, что уже есть, ограничения. Если вопрос простой
         и всё ясно - пропусти этот шаг и скажи, что уточнять нечего.
      2. Отвечай так: сначала суть в 2-3 предложениях, потом детали ниже.
      3. Ничего не додумывай и не предполагай. Чего не знаешь - скажи, что не
         знаешь. Что не проверено - пометь как непроверенное. Ссылок не
         выдумывай: если нужны источники, скажи, что и где искать.
      4. Числа, единицы и термины бери только из того, что дал пользователь.

  - presetId: 3c9d1e7f-5a2b-4c8d-b6e0-7f1a2b3c4d5e
    title: "✏️ Править текст"
    purpose: "исправить свой текст, не меняя смысла и стиля"
    slot: fable
    instructions: |
      Ты редактор научных текстов на русском языке. Пользователь присылает
      фрагмент - верни его исправленным.
      - Исправляй ошибки: терминология, согласование, орфография, единицы,
        логика, оформление величин. Смысл, данные и стиль автора не меняй;
        не улучшай и не переписывай то, что не ошибка.
      - Ничего не добавляй от себя.
      - Сначала исправленный текст целиком, затем список правок: что изменено
        и почему, коротко, по пунктам.
      - Если текст длиннее примерно 40 страниц (около 30 тысяч слов), не
        начинай: скажи, что его надо прислать по главам, или прочитать
        кнопкой Astra Pro и работать с выжимкой.

  - presetId: 6a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
    title: "🔍 Рецензия"
    purpose: "проверить статью или диплом: ошибки по пунктам"
    slot: astra-pro
    instructions: |
      Ты рецензент научного журнала по химии и материаловедению. Пользователь
      присылает текст (раздел, статью, главу) - дай рецензию, не переписывая
      текст.
      По пунктам, каждый с цитатой места, о котором речь:
      1. Фактические и логические ошибки, противоречия внутри текста
         (одна величина в разных местах по-разному, вывод не следует из
         данных).
      2. Утверждения без обоснования или без ссылки на данные.
      3. Ошибки в терминах, единицах, оформлении величин.
      4. Чего не хватает, чтобы текст приняли: методика, статистика, контроль.
      В конце - общий вердикт в трёх предложениях и три самых важных правки.
      Ссылок на литературу не выдумывай: если нужен источник, скажи, что
      именно искать. Ничего не додумывай за автора; сомневаешься - задай
      вопрос, а не утверждай.

  - presetId: 9f8e7d6c-5b4a-4938-a271-6c5d4e3f2a1b
    title: "🎛 Варианты"
    purpose: "пять вариантов решения или улучшения"
    slot: opus
    instructions: |
      Пользователь описывает задачу или решение. Не давай одного ответа -
      дай выбор.
      - На задачу: 5 разных вариантов решения. Для каждого: суть в одну-две
        строки, за, против, когда уместен. В конце - какой выбрал бы ты и
        почему, одним абзацем.
      - На готовое решение («улучши», «что не так»): 5 вариантов, как его
        улучшить, от самого простого к самому сильному, с ценой каждого
        (время, деньги, риск).
      Варианты должны реально отличаться, а не быть пересказом одного.
      Ничего не додумывай о том, чего пользователь не сказал; чего не
      хватает для выбора - спроси.

# The category shows in the menu as its icon only - the word was noise
# (owner, 2026-09-22). LibreChat itself appends the model id after the
# title, so the title carries only the label and the price marker.
categories:
  flagship:  { title: "флагман",  icon: "🧠" }
  workhorse: { title: "рабочая",  icon: "⚙️" }
  cheap:     { title: "выгодная", icon: "⚡" }

# Price marker x<N> = out_per_m / price_unit, rounded. Colour by that N.
price_unit: 2.5
colours:
  - { max: 1, emoji: "⚪️" }
  - { max: 7, emoji: "🟢" }
  - { emoji: "🔴" }

vendors:
  - name: Claude
    prefix: anthropic/
    flagship:

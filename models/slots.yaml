# The chat's models, arranged by vendor and category. This file is the source
# of truth for presets/presets.json, which scripts/build_presets.py generates
# from it - do not edit presets.json by hand, validate.py rejects that.
#
# Categories, the same four for every vendor, top to bottom:
#   flagship  - THE model the vendor positions as its best. Exactly one per vendor.
#   frontier  - the strong model one step below, for serious everyday work
#   workhorse - the everyday model, good and reasonably priced
#   cheap     - cost-effective: the small fast one for simple tasks
#
# A category is a POSITION IN THE VENDOR'S LINE-UP, not a price. The vendor
# names its tiers (Fable > Opus > Sonnet > Haiku; Astra > Terra > Sol > Luna;
# Pro > Flash), and each vendor's `ladder` below records those names per category.
# validate.py checks that every model sits on the rung its name says. A new
# version of a rung (Opus 5 -> Opus 5.5) inherits the category; a new NAME the
# ladder does not know is reported by the monthly check, never guessed.
#
# Every model here is one preset in the chat; its title is built from vendor,
# category, label and price, so a new version replaces the entry in place
# (keep the presetId) and the mother sees the same preset with a new version.
#
# Per model:
#   id        - OpenRouter model id; must also be in the "Все" list of librechat.yaml
#   presetId  - stable UUID of the preset in MongoDB; never changes for a slot
#   label     - short human name shown in brackets in the preset title
#   out_per_m - output price in USD per 1M tokens, as OpenRouter reports it;
#               refreshed by scripts/check_models.py --update-prices, never typed
#
# Per vendor:
#   prefix - the OpenRouter id prefix of the vendor
#   core   - true for the vendors that are the point of the menu (the others
#            are cheap extras the review may retire)
#   ladder - per category, the words in the model id that mark that rung.
#            Matched against the id after the prefix, longest word first, so
#            "astra-pro" wins over "astra". A category without a rung word is
#            one the vendor simply does not sell.
#
# Empty shelves are legitimate: a vendor that sells no model of a rung has
# none here, and nothing is added just to fill a grid. Grok, Kimi and GLM are
# one strong line each - frontier, not flagship, by the owner's call; a rung
# the vendor does not sell on OpenRouter (Grok Heavy) is not in the ladder.
#
# The order of the vendors here is the order in the chat's preset menu
# (inside each category); GLM before Kimi by the owner's call, 2026-09-22.
#
# Vendors: the four frontier labs, then the Chinese ones. Kimi and GLM stay;
# other vendors are added only after they proved themselves on the standard
# test (see CLAUDE.md, "Monthly model review"). Adding a vendor is one block.

endpoint: "Все"

# Hard cap on presets in the chat, so the menu stays readable. A new model
# beyond the cap must replace one, not be added next to it.
max_models: 20

categories:
  flagship:  { title: "флагман",   icon: "🧠" }
  frontier:  { title: "передовая", icon: "🔥" }
  workhorse: { title: "рабочая",   icon: "⚙️" }
  cheap:     { title: "выгодная",  icon: "⚡" }

# Price marker x<N> = out_per_m / price_unit, rounded. Colour by that N.
price_unit: 2.5
colours:
  - { max: 1, emoji: "⚪️" }
  - { max: 7, emoji: "🟢" }
  - { emoji: "🔴" }

vendors:
  - name: Claude
    core: true
    prefix: anthropic/
    ladder:
      flagship:  [fable]
      frontier:  [opus]
      workhorse: [sonnet]
      cheap:     [haiku]
    flagship:
      - { id: anthropic/claude-fable-5.1, presetId: b8d5531b-257e-4869-ada5-3c96cfae7b2b, label: "Fable 5.1", out_per_m: 50.0 }
    frontier:
      - { id: anthropic/claude-opus-5.5,  presetId: 794f02de-4ec5-49c2-84af-600994a2a41d, label: "Opus 5.5",  out_per_m: 20.0 }
    workhorse:
      - { id: anthropic/claude-sonnet-5,  presetId: 0f7adf43-3c73-49a4-b6c4-934e9a5e9e12, label: "Sonnet 5",  out_per_m: 10.0 }
    cheap: []

  - name: OpenAI
    core: true
    prefix: openai/
    # astra and astra-pro cost the same and are one rung; the plain Astra is
    # not offered next to the Pro. -pro is a variant suffix, not a rung.
    ladder:
      flagship:  [astra]
      frontier:  [terra]
      workhorse: [sol]
      cheap:     [luna]
    flagship:
      - { id: openai/gpt-6-astra-pro,   presetId: ff117436-ed01-4691-82a5-3bd77a1bf058, label: "GPT-6 Astra Pro", out_per_m: 50.0 }
    frontier:

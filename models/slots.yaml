    workhorse:
      - { id: anthropic/claude-opus-5.5,  presetId: 794f02de-4ec5-49c2-84af-600994a2a41d, label: "Opus 5.5",  line: opus,   out_per_m: 20.0, rank: 1, purpose: "Всё, когда не знаешь" }

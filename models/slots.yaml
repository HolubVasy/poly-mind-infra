    cheap: []

  # Cheap extras kept from the presets as they were on 2026-09-22.
  - name: DeepSeek
    prefix: deepseek/
    flagship: []
    workhorse: []
    cheap:
      - { id: deepseek/deepseek-v4-pro-0813, presetId: dbeba7cf-f4e0-496b-b9af-cc73aa208534, label: "DeepSeek V4", line: deepseek-v4, out_per_m: 1.98 }


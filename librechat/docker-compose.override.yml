services:
  api:
    # Stable release v0.8.7 (2026-06-24), pinned by digest so nothing moves on
    # its own. Was librechat-dev from 2026-02-17, pinned because newer images
    # refuse LibreChat's public default JWT_SECRET (rotated 2026-09-23, #42).
    image: ghcr.io/danny-avila/librechat:v0.8.7@sha256:c5db3331b845e1f289f8d04c0c77936c4bbe372f76730a804abc1c37e44d23a9
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/logs

  rag_api:
    image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:latest

version: 1.1.5

cache: true

endpoints:
  custom:
    - name: "Методика наночастиц (Gemini MAX)"
      apiKey: "${OPENROUTER_API_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default: [
          "google/gemini-2.5-pro",
          "google/gemini-3-flash-preview",
          "google/gemini-2.5-flash"
        ]
      modelOptions:
        max_tokens: 8192
        maxTokens: 8192
      fetch: false
      modelDisplayLabel: "Методика (Gemini)"

    - name: "Методика наночастиц (GPT MAX)"
      apiKey: "${OPENROUTER_API_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "openai/gpt-5.2"
      fetch: false
      modelDisplayLabel: "Методика (GPT)"

    - name: "Поиск источников (обзор)"
      apiKey: "${OPENROUTER_API_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default: [
          "google/gemini-2.5-pro",
          "openai/gpt-5.1",
          "openai/gpt-5.2-chat",
          "google/gemini-3-flash-preview",
          "google/gemini-2.5-flash"
        ]
      modelOptions:
        max_tokens: 8192
        maxTokens: 8192
      fetch: false
      modelDisplayLabel: "Источники"

    - name: "Редактор статьи GPT (строго)"
      apiKey: "${OPENROUTER_API_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default: [
          "openai/gpt-5.2"
        ]
      fetch: false
      modelDisplayLabel: "Редактор GPT"

    - name: "Редактор статьи Sonet (строго)"
      apiKey: "${OPENROUTER_API_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default: [
          "anthropic/claude-opus-4.1"
        ]
      modelOptions:
        max_tokens: 8192
        maxTokens: 8192
      fetch: false
      modelDisplayLabel: "Редактор Sonet"

    - name: "Редактор статьи Gemini (строго)"
      apiKey: "${OPENROUTER_API_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default: [
          "google/gemini-2.5-pro",
          "google/gemini-3-flash-preview",
        ]
      modelOptions:
        max_tokens: 8192
        maxTokens: 8192
      fetch: false
      modelDisplayLabel: "Редактор Gemini"

    - name: "Редактор статьи (супер дорого)"
      apiKey: "${OPENROUTER_API_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default: [
          "openai/gpt-5.2-pro",
          "google/gemini-2.5-pro",
          "anthropic/claude-opus-4.6"
        ]
      modelOptions:
        max_tokens: 2048
        maxTokens: 2048
      fetch: false
      modelDisplayLabel: "Редактор супер"

    - name: "Все"
      apiKey: "${OPENROUTER_API_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default: [
          "anthropic/claude-fable-5.1",
          "anthropic/claude-sonnet-5",
          "openai/gpt-6-astra-pro",
          "openai/gpt-5.6-terra-pro",
          "openai/gpt-6-luna-pro",
          "openai/gpt-5.2",
          "openai/gpt-5-mini",
          "x-ai/grok-4.7",
          "x-ai/grok-4.5",
          "moonshotai/kimi-k3",
          "z-ai/glm-5.3",
          "google/gemini-3.8-flash",
          "google/gemini-2.5-pro",
          "deepseek/deepseek-v4-pro-0813",
          "minimax/minimax-m3"
        ]
      modelOptions:
        max_tokens: 2048
        maxTokens: 2048
      fetch: true
      modelDisplayLabel: "Редактор супер"
